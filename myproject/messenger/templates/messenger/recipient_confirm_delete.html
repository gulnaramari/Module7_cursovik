{% extends 'messenger/base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<h2>Удаление рассылки</h2>
<p>Вы уверены, что хотите удалить получателя "{{ recipient.email }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'messenger:list_recipient' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
