{% extends 'base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<h2>Удаление рассылки</h2>
<p>Вы уверены, что хотите удалить рассылку "{{ mailing.message.subject }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
