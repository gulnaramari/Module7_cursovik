{% extends 'messenger/base.html' %}

{% block title %}Список получателей{% endblock %}

{% block content %}
<h2>Список получателей</h2>
<a href="{% url 'messenger:list_recipient' %}" class="btn btn-success">Добавить получателя</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Имя</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
    </thead>
    <body>
        {% for recipient in recipients %}
        <tr>
            <td>{{ recipient.name }}</td>
            <td>{{ recipient.email }}</td>
            <td>
                <a href="{% url 'messenger:recipient_form' recipient.pk %}" class="btn btn-warning">Редактировать</a>
                <a href="{% url 'messenger:mailing_confirm_delete' recipient.pk %}" class="btn btn-danger">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </body>
</table>
{% endblock %}
